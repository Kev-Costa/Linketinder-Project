<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empresa</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
<div class="container">
    <button class="btn btn-voltar" onclick="window.location.href='index.html'">⬅ Voltar</button>
    <h2>Cadastro de Nova Empresa</h2>
    <form id="form-cad-emp">
        <label>Nome da Empresa: <input type="text" id="nome" required></label>
        <label>E-mail Corporativo: <input type="email" id="email" required></label>
        <label>CNPJ: <input type="text" id="cnpj" required></label>
        <label>País: <input type="text" id="pais" required></label>
        <label>Estado (UF): <input type="text" id="estado" required></label>
        <label>CEP: <input type="text" id="cep" required></label>
        <label>Descrição da Empresa: <textarea id="descricao"></textarea></label>
        <button type="submit" class="btn">Salvar Empresa</button>
    </form>
</div>
<script src="/frontend/dist/cadCand-bundle.js"></script>
</body>
</html>
