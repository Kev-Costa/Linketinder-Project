<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Candidato</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
<div class="container">
    <button class="btn btn-voltar" onclick="window.location.href='index.html'">⬅ Voltar</button>
    <h2>Cadastro de Novo Candidato</h2>
    <form id="form-cad-cand">
        <label>Nome Completo: <input type="text" id="nome" required></label>
        <label>E-mail: <input type="email" id="email" required></label>
        <label>Senha de Acesso: <input type="password" id="senha" required></label>
        <label>CPF: <input type="text" id="cpf" required></label>
        <label>Idade: <input type="number" id="idade" required></label>
        <label>Formação: <input type="text" id="formacao" required></label>
        <label>Estado (UF): <input type="text" id="estado" required></label>
        <label>CEP: <input type="text" id="cep" required></label>
        <label>Descrição Profissional: <textarea id="descricao"></textarea></label>
        <button type="submit" class="btn btn-success">Salvar Cadastro</button>
    </form>
</div>
<script src="/frontend/dist/cadEmp-bundle.js"></script>
</body>
</html>
